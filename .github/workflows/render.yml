name: Render documentary

on:
  workflow_dispatch:
    inputs:
      composition:
        description: 'Composition ID (ignored by this workflow)'
        required: false
        default: 'MyComposition'
      quality:
        description: 'draft = 30s test · final = full render'
        required: false
        default: 'final'

jobs:
  render:
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Chrome dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libdbus-1-3 libatk1.0-0 libasound2 libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libgbm-dev libcups2

      - name: Install packages
        run: npm install --no-audit --no-fund

      - name: Check assets
        run: npm run check:assets

      - name: Typecheck
        run: npm run typecheck

      - name: Render (test, first 30s)
        if: ${{ github.event.inputs.quality == 'draft' }}
        run: npm run render:test

      - name: Render (full)
        if: ${{ github.event.inputs.quality != 'draft' }}
        run: npm run render

      - name: Upload video
        uses: actions/upload-artifact@v4
        with:
          name: documentary
          path: out/*.mp4
          retention-days: 7